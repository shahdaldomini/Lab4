{% load static %}

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<title>LUXORA - Register</title>

<link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>


<body>


<div class="login-box">


<h1>
LUXORA
</h1>


<h2>
إنشاء حساب
</h2>



<form method="post">

{% csrf_token %}


<input 
type="text" 
name="username" 
placeholder="اسم المستخدم"
required>



<input 
type="password" 
name="password" 
placeholder="كلمة المرور"
required>



<input 
type="password" 
name="password2" 
placeholder="تأكيد كلمة المرور"
required>



<button type="submit">
تسجيل
</button>


</form>



<p>

لديك حساب؟

<a href="{% url 'login' %}">
تسجيل الدخول
</a>

</p>


</div>


</body>

</html>
